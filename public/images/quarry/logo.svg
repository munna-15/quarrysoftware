<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Quarry Software</title>
  <desc id="logo-desc">Geometric Q symbol with Quarry Software wordmark.</desc>

  <defs>
    <style>
      .mark-outline {
        fill: #091C32;
        stroke: #F5F4EF;
        stroke-width: 10;
        stroke-linejoin: round;
        paint-order: stroke fill;
      }

      .word-outline {
        fill: #091C32;
        stroke: #F5F4EF;
        stroke-width: 5.5;
        stroke-linejoin: round;
        paint-order: stroke fill;
      }

      .word {
        font-family: Inter, Arial, Helvetica, sans-serif;
        font-weight: 800;
        letter-spacing: 2px;
      }

      .sub {
        font-family: Inter, Arial, Helvetica, sans-serif;
        font-weight: 600;
        letter-spacing: 8px;
      }
    </style>
  </defs>

  <!-- Geometric Q symbol -->
  <g transform="translate(22 22)">
    <path
      class="mark-outline"
      fill-rule="evenodd"
      d="M68 4a62 62 0 1 0 0 124A62 62 0 0 0 68 4Zm0 24a38 38 0 1 1 0 76 38 38 0 0 1 0-76Z"
    />
    <path
      class="mark-outline"
      d="m75 77 48 48-17 17-48-48Z"
    />
  </g>

  <!-- Brand name -->
  <text
    x="190"
    y="94"
    class="word word-outline"
    font-size="68"
  >QUARRY</text>

  <!-- Brand descriptor -->
  <text
    x="196"
    y="133"
    class="sub"
    fill="#091C32"
    stroke="#F5F4EF"
    stroke-width="3"
    stroke-linejoin="round"
    paint-order="stroke fill"
    font-size="21"
  >SOFTWARE</text>
</svg>